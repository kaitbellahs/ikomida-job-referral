apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: referral
  name: referral-job
  namespace: ikomida-job
spec:
  schedule: "0 0 15 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600 # 60s * 60m * 6h
  suspend: false
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: referral
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
            fsGroup: 2000
            runAsNonRoot: true
          restartPolicy: OnFailure
          containers:
            - image: us-central1-docker.pkg.dev/ikomida-prod/docker/referral-job-image:latest
              name: referral-job
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - all
                privileged: false
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: "20m"
                  memory: "200m"
                limits:
                  cpu: "40m"
                  memory: "400m"
              env:
                - name: NODE_ENV
                  value: "homologation"
                - name: IKOMIDA_PRIVATEKEY
                  valueFrom:
                    secretKeyRef:
                      name: environment
                      key: IKOMIDA_PRIVATEKEY
                      optional: false
                - name: IKOMIDA_PUBLICKEY
                  valueFrom:
                    secretKeyRef:
                      name: environment
                      key: IKOMIDA_PUBLICKEY
                      optional: false
                - name: DBUSER
                  valueFrom:
                    secretKeyRef:
                      name: environment
                      key: DBUSER
                - name: DBPASS
                  valueFrom:
                    secretKeyRef:
                      name: environment
                      key: DBPASS
                - name: DBNAME
                  valueFrom:
                    secretKeyRef:
                      name: environment
                      key: DBNAME
                - name: DBHOST
                  valueFrom:
                    secretKeyRef:
                      name: environment
                      key: DBHOST
                - name: DBPORT
                  valueFrom:
                    secretKeyRef:
                      name: environment
                      key: DBPORT
